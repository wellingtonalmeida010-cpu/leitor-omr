<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor OMR - Cartão Resposta</title>
<script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #121212; color: #fff; text-align: center; }
  h2 { margin-top: 0; font-size: 18px; }
  .card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: left; }
  label { display: block; font-size: 13px; margin-bottom: 5px; color: #bbb; }
  input[type="text"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #2c2c2c; color: #fff; box-sizing: border-box; font-size: 15px; margin-bottom: 10px; }
  button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
  .btn-cam { background: #1a73e8; color: white; }
  .btn-scan { background: #0f9d58; color: white; }
  .btn-send { background: #f4b400; color: #000; }
  .btn-csv  { background: #555; color: #fff; font-size: 13px; padding: 10px; }
  video, canvas { width: 100%; max-width: 450px; border-radius: 8px; border: 2px solid #333; margin-top: 10px; }
  #resultado-box { background: #263238; padding: 15px; border-radius: 8px; margin-top: 10px; display: none; }
  .destaque { font-size: 22px; font-weight: bold; color: #4caf50; }
  #status-cv { font-size: 12px; color: #ff9800; margin-bottom: 10px; }
</style>
</head>
<body>

<h2>📷 Leitor de Gabaritos</h2>
<div id="status-cv">Carregando motor de visão (OpenCV)...</div>

<div class="card">
  <label>Gabarito Oficial (10 letras sem espaço, ex: ABCDABCDAB):</label>
  <input type="text" id="gabarito" maxlength="10" value="ABCDABCDAB" oninput="this.value = this.value.toUpperCase()">

  <label>URL do Google Apps Script:</label>
  <input type="text" id="script-url" placeholder="https://script.google.com/macros/s/.../exec" oninput="salvarUrlScript()">
</div>

<button class="btn-cam" onclick="iniciarCamera()">1. Abrir Câmera</button>
<video id="video" playsinline autoplay style="display:none;"></video>
<button class="btn-scan" id="btn-capturar" onclick="capturarEProcessar()" style="display:none;">2. Capturar e Corrigir</button>

<canvas id="canvas-debug" style="display:none;"></canvas>

<div id="resultado-box">
  <div>Aluno Nº: <span id="res-chamada" class="destaque">--</span></div>
  <div>Nota: <span id="res-nota" class="destaque">--</span> / 10</div>
  <div style="font-size: 13px; margin-top: 5px; color: #ccc;">Lido: <span id="res-detalhes"></span></div>
  <br>
  <button class="btn-send" onclick="enviarParaPlanilha()">3. Enviar para Google Planilhas</button>
</div>

<button class="btn-csv" onclick="baixarCSV()">📥 Baixar Histórico em CSV (Offline)</button>

<script>
let cvPronto = false;
let ultimaLeitura = null;
let historico = [];

// Carrega URL salva no navegador ao iniciar
window.addEventListener('DOMContentLoaded', () => {
  const urlSalva = localStorage.getItem('omr_script_url');
  if (urlSalva) {
    document.getElementById('script-url').value = urlSalva;
  }
});

function salvarUrlScript() {
  const url = document.getElementById('script-url').value.trim();
  localStorage.setItem('omr_script_url', url);
}

function onOpenCvReady() {
  cvPronto = true;
  document.getElementById('status-cv').innerText = "✅ Motor OpenCV pronto!";
  document.getElementById('status-cv').style.color = "#4caf50";
}

async function iniciarCamera() {
  const video = document.getElementById('video');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    video.style.display = 'block';
    document.getElementById('btn-capturar').style.display = 'block';
  } catch (err) {
    alert("Erro ao acessar câmera. Verifique as permissões ou abra via HTTPS: " + err);
  }
}

function capturarEProcessar() {
  if (!cvPronto) return alert("Aguarde o OpenCV terminar de carregar.");
  
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas-debug');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  let src = cv.imread(canvas);
  let gray = new cv.Mat();
  let thresh = new cv.Mat();

  cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
  cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
  cv.threshold(gray, thresh, 0, 255, cv.THRESH_BINARY_INV + cv.THRESH_OTSU);

  // 1. Encontrar os 4 quadrados pretos (âncoras)
  let contours = new cv.MatVector();
  let hierarchy = new cv.Mat();
  cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

  let ancoras = [];
  for (let i = 0; i < contours.size(); ++i) {
    let cnt = contours.get(i);
    let area = cv.contourArea(cnt);
    if (area > 400) {
      let peri = cv.arcLength(cnt, true);
      let approx = new cv.Mat();
      cv.approxPolyDP(cnt, approx, 0.04 * peri, true);
      let rect = cv.boundingRect(approx);
      let ratio = rect.width / rect.height;
      if (approx.rows === 4 && ratio >= 0.75 && ratio <= 1.25) {
        let m = cv.moments(cnt);
        ancoras.push({ x: m.m10 / m.m00, y: m.m01 / m.m00, area: area });
      }
      approx.delete();
    }
  }

  if (ancoras.length < 4) {
    alert("Não encontrei os 4 quadrados pretos dos cantos. Enquadre melhor a área com boa iluminação.");
    src.delete(); gray.delete(); thresh.delete(); contours.delete(); hierarchy.delete();
    return;
  }

  ancoras.sort((a, b) => b.area - a.area);
  let top4 = ancoras.slice(0, 4);
  top4.sort((a, b) => a.y - b.y);
  let top2 = top4.slice(0, 2).sort((a, b) => a.x - b.x);
  let bot2 = top4.slice(2, 4).sort((a, b) => a.x - b.x);

  // 2. Corrigir perspectiva para 800x600 px
  const W = 800, H = 600;
  let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
    top2[0].x, top2[0].y,
    top2[1].x, top2[1].y,
    bot2[0].x, bot2[0].y,
    bot2[1].x, bot2[1].y
  ]);
  let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, W, 0, 0, H, W, H]);
  let M = cv.getPerspectiveTransform(srcTri, dstTri);
  let warped = new cv.Mat();
  let warpedColor = new cv.Mat();
  cv.warpPerspective(thresh, warped, M, new cv.Size(W, H));
  cv.warpPerspective(src, warpedColor, M, new cv.Size(W, H));

  function lerBolinha(px, py) {
    let cx = Math.round(px * W);
    let cy = Math.round(py * H);
    let r = 12;
    let roi = warped.roi(new cv.Rect(cx - r, cy - r, r * 2, r * 2));
    let preenchido = cv.countNonZero(roi);
    roi.delete();
    return { preenchido, cx, cy };
  }

  // 3. Ler Nº de Chamada (Ajustado para o layout do Word)
  let dezena = 0, maxDez = 0;
  for (let d = 0; d <= 3; d++) {
    let res = lerBolinha(0.272, 0.355 + d * 0.052);
    cv.circle(warpedColor, new cv.Point(res.cx, res.cy), 11, [0, 255, 255, 255], 2);
    if (res.preenchido > maxDez) { maxDez = res.preenchido; dezena = d; }
  }

  let unidade = 0, maxUni = 0;
  for (let u = 0; u <= 9; u++) {
    let res = lerBolinha(0.345, 0.355 + u * 0.052);
    cv.circle(warpedColor, new cv.Point(res.cx, res.cy), 11, [0, 255, 255, 255], 2);
    if (res.preenchido > maxUni) { maxUni = res.preenchido; unidade = u; }
  }
  let numChamada = `${dezena}${unidade}`;

  // 4. Ler 10 Questões A, B, C, D (Ajustado para alinhar perfeitamente)
  const gabarito = document.getElementById('gabarito').value.trim();
  const letras = ['A', 'B', 'C', 'D'];
  let acertos = 0;
  let respostasLidas = [];

  for (let q = 0; q < 10; q++) {
    let melhorLetra = '-';
    let maxPixels = 150; 
    let melhorPonto = null;

    for (let opt = 0; opt < 4; opt++) {
      let res = lerBolinha(0.550 + opt * 0.076, 0.285 + q * 0.063);
      if (res.preenchido > maxPixels) {
        maxPixels = res.preenchido;
        melhorLetra = letras[opt];
        melhorPonto = res;
      }
    }

    respostasLidas.push(melhorLetra);
    let correta = gabarito[q] === melhorLetra;
    if (correta) acertos++;

    if (melhorPonto) {
      let cor = correta ? [0, 255, 0, 255] : [255, 0, 0, 255];
      cv.circle(warpedColor, new cv.Point(melhorPonto.cx, melhorPonto.cy), 13, cor, 3);
    }
  }

  canvas.style.display = 'block';
  cv.imshow(canvas, warpedColor);

  ultimaLeitura = {
    chamada: numChamada,
    nota: acertos,
    acertos: `${acertos}/10`,
    respostas: respostasLidas.join('')
  };
  historico.push(ultimaLeitura);

  document.getElementById('res-chamada').innerText = numChamada;
  document.getElementById('res-nota').innerText = acertos;
  document.getElementById('res-detalhes').innerText = respostasLidas.join(' - ');
  document.getElementById('resultado-box').style.display = 'block';

  src.delete(); gray.delete(); thresh.delete(); contours.delete(); hierarchy.delete();
  srcTri.delete(); dstTri.delete(); M.delete(); warped.delete(); warpedColor.delete();
}

async function enviarParaPlanilha() {
  const url = document.getElementById('script-url').value.trim();
  if (!url) return alert("Cole a URL do Google Apps Script primeiro.");
  if (!ultimaLeitura) return;

  try {
    await fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(ultimaLeitura)
    });
    alert(`✅ Aluno ${ultimaLeitura.chamada} (Nota ${ultimaLeuritNota = ultimaLeitura.nota}) enviado para a planilha!`);
  } catch (e) {
    alert("Erro ao enviar: " + e);
  }
}

function baixarCSV() {
  if (historico.length === 0) return alert("Nenhuma leitura realizada ainda.");
  let csv = "Chamada;Nota;Acertos;Respostas\n";
  historico.forEach(item => {
    csv += `${item.chamada};${item.nota};${item.acertos};${item.respostas}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "notas_lidas.csv";
  link.click();
}
</script>
</body>
</html>
